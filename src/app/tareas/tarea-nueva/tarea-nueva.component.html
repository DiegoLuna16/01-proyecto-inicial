<div class="fondo" (click)="cerrarTareaNueva()"></div>
<dialog open>
  <h2>Agregar Tarea</h2>
  <form (ngSubmit)="guardarTarea()">
    <p>
      <label for="titulo">Titulo</label>
      <input type="text" id="titulo" name="titulo" [(ngModel)]="titulo" />
    </p>

    <p>
      <label for="resumen">Resumen</label>
      <textarea
        id="resumen"
        rows="5"
        name="resumen"
        [(ngModel)]="resumen"
      ></textarea>
    </p>

    <p>
      <label for="expira">Fecha Límite</label>
      <input type="date" id="expira" name="expira" [(ngModel)]="fecha" />
    </p>

    <p class="acciones">
      <button type="button" (click)="cerrarTareaNueva()">Cancelar</button>
      <button type="submit">Crear</button>
    </p>
  </form>
</dialog>
